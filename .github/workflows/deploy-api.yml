name: Standalone Functions API

on:
  push:
    branches: ['azure']
    paths:
      - 'api/**'
      - '.github/workflows/deploy-api.yml'
  pull_request:
    branches: ['azure']
    paths:
      - 'api/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'
      - name: Publish API package
        run: dotnet publish api/api.csproj --configuration Release --output function-api
      - name: Require only the online functions in the package
        shell: pwsh
        run: |
          $functions = @(Get-Content function-api/functions.metadata -Raw | ConvertFrom-Json)
          if ($functions.Count -eq 0) { throw 'The package has no function metadata.' }
          foreach ($function in $functions) {
            if ($function.name -in @('Upload', 'Download')) { throw "The package contains the removed legacy function $($function.name)." }
            foreach ($binding in @($function.bindings | Where-Object { $_.type -eq 'httpTrigger' })) {
              if ($binding.route -notmatch '^(online|feed)/') { throw "The HTTP function $($function.name) is not an online or TV link route." }
            }
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/azure'
        with:
          name: function-api
          path: function-api
          include-hidden-files: true

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/azure'
    needs: verify
    runs-on: ubuntu-latest
    environment: azure-functions
    concurrency:
      group: deploy-api
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_DEPLOY_CLIENT_ID: ${{ secrets.AZURE_DEPLOY_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
      AZURE_FUNCTION_APP_NAME: ${{ secrets.AZURE_FUNCTION_APP_NAME }}
    steps:
      - name: Require explicit deployment configuration
        shell: pwsh
        run: |
          foreach ($name in @('AZURE_DEPLOY_CLIENT_ID', 'AZURE_TENANT_ID', 'AZURE_SUBSCRIPTION_ID', 'AZURE_RESOURCE_GROUP', 'AZURE_FUNCTION_APP_NAME')) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Missing azure-functions environment secret: $name"
            }
          }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: function-api
          path: function-api
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ secrets.AZURE_DEPLOY_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Require configured auth and playlist storage
        shell: pwsh
        run: |
          $json = az functionapp config appsettings list --name $env:AZURE_FUNCTION_APP_NAME --resource-group $env:AZURE_RESOURCE_GROUP --output json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read Function App settings.' }
          $settings = @{}
          foreach ($setting in ($json | ConvertFrom-Json)) { $settings[$setting.name] = $setting.value }
          foreach ($name in @('OnlineAuth__TenantId', 'OnlineAuth__ApiClientId', 'OnlineAuth__SpaClientId', 'OnlineAuth__RequiredScope', 'OnlineAuth__AllowedObjectIds')) {
            if ([string]::IsNullOrWhiteSpace($settings[$name])) { throw "Missing Function App setting: $name" }
          }
          $hasStorageConnectionString = -not [string]::IsNullOrWhiteSpace($settings['OnlinePlaylistStorage'])
          $hasStorageIdentityUris = (-not [string]::IsNullOrWhiteSpace($settings['OnlinePlaylistStorage__blobServiceUri'])) -and (-not [string]::IsNullOrWhiteSpace($settings['OnlinePlaylistStorage__queueServiceUri']))
          if (-not ($hasStorageConnectionString -or $hasStorageIdentityUris)) {
            throw 'Missing playlist storage: set OnlinePlaylistStorage__blobServiceUri and OnlinePlaylistStorage__queueServiceUri, or an OnlinePlaylistStorage connection string.'
          }
          $runtime = az resource show --resource-group $env:AZURE_RESOURCE_GROUP --name $env:AZURE_FUNCTION_APP_NAME --resource-type Microsoft.Web/sites --query properties.functionAppConfig.runtime.name --output tsv
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read the Function App.' }
          if ([string]::IsNullOrWhiteSpace($runtime)) { $runtime = $settings['FUNCTIONS_WORKER_RUNTIME'] }
          if ($runtime -ne 'dotnet-isolated') { throw 'Expected the dotnet-isolated worker.' }
      - name: Deploy only the Function App
        uses: Azure/functions-action@c5060b3b8bb1ebbcb531abd00c822ecbaa8ea656 # v1.5.7
        with:
          app-name: ${{ secrets.AZURE_FUNCTION_APP_NAME }}
          package: function-api
